<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>SSIDMail — Enterprise Inbox</title>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet"/>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/tabler-icons.min.css"/>
<style>
*{margin:0;padding:0;box-sizing:border-box;}

:root{
  --bg:#0a0b0f;
  --surface:#111218;
  --surface2:#16181f;
  --surface3:#1c1e27;
  --border:#ffffff0f;
  --border2:#ffffff18;
  --text:#f0f1f5;
  --text2:#8b8fa8;
  --text3:#555868;
  --accent:#4f6ef7;
  --accent2:#6b83f7;
  --accent-bg:#4f6ef714;
  --accent-border:#4f6ef730;
  --green:#22c55e;
  --green-bg:#22c55e12;
  --red:#ef4444;
  --amber:#f59e0b;
  --radius-sm:6px;
  --radius-md:10px;
  --radius-lg:14px;
  --radius-xl:18px;
}

html,body{height:100%;overflow:hidden;}

body{
  font-family:'Plus Jakarta Sans',sans-serif;
  background:var(--bg);
  color:var(--text);
  display:flex;
  height:100vh;
}

/* ── SIDEBAR ─────────────────────────────────── */
.sidebar{
  width:260px;
  flex-shrink:0;
  background:var(--surface);
  border-right:1px solid var(--border);
  display:flex;
  flex-direction:column;
  height:100vh;
}

.sidebar-top{
  padding:20px 18px 16px;
  border-bottom:1px solid var(--border);
}

.wordmark{
  display:flex;
  align-items:center;
  gap:10px;
  margin-bottom:18px;
}

.wordmark-icon{
  width:32px;height:32px;
  border-radius:8px;
  background:var(--accent);
  display:flex;align-items:center;justify-content:center;
}

.wordmark-icon i{font-size:16px;color:#fff;}

.wordmark-name{
  font-size:15px;
  font-weight:600;
  letter-spacing:-0.2px;
}

.wordmark-badge{
  margin-left:auto;
  font-size:10px;font-weight:500;
  background:var(--accent-bg);
  color:var(--accent2);
  border:1px solid var(--accent-border);
  padding:2px 7px;
  border-radius:20px;
  font-family:'DM Mono',monospace;
  letter-spacing:0.3px;
}

/* compose area */
.compose-area{
  display:flex;flex-direction:column;gap:8px;
}

.field-label{
  font-size:11px;font-weight:500;
  color:var(--text3);
  text-transform:uppercase;letter-spacing:0.6px;
  margin-bottom:4px;
}

.input-shell{
  display:flex;align-items:center;
  background:var(--surface2);
  border:1px solid var(--border2);
  border-radius:var(--radius-md);
  overflow:hidden;
  transition:border-color .15s;
}

.input-shell:focus-within{
  border-color:var(--accent);
  box-shadow:0 0 0 3px var(--accent-bg);
}

.input-shell input{
  flex:1;border:none;outline:none;
  background:transparent;
  padding:10px 12px;
  font-family:'DM Mono',monospace;
  font-size:13px;color:var(--text);
}

.input-shell input::placeholder{color:var(--text3);}

.domain-chip{
  padding:0 12px;
  font-family:'DM Mono',monospace;
  font-size:12px;color:var(--accent2);font-weight:500;
  border-left:1px solid var(--border2);
  white-space:nowrap;
}

.btn-row{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:4px;}

.btn{
  display:flex;align-items:center;justify-content:center;gap:6px;
  padding:9px 12px;
  border:1px solid var(--border2);
  border-radius:var(--radius-md);
  font-family:'Plus Jakarta Sans',sans-serif;
  font-size:13px;font-weight:500;
  cursor:pointer;
  transition:all .15s;
  color:var(--text2);
  background:var(--surface2);
}

.btn i{font-size:15px;}
.btn:hover{background:var(--surface3);border-color:var(--border2);color:var(--text);}
.btn:active{transform:scale(0.97);}

.btn-accent{
  background:var(--accent);
  border-color:var(--accent);
  color:#fff;
}
.btn-accent:hover{background:var(--accent2);border-color:var(--accent2);color:#fff;}

/* nav */
.sidebar-nav{
  flex:1;
  padding:12px 10px;
  display:flex;flex-direction:column;gap:2px;
  overflow-y:auto;
}

.nav-item{
  display:flex;align-items:center;gap:10px;
  padding:9px 10px;
  border-radius:var(--radius-md);
  font-size:13px;font-weight:500;
  cursor:pointer;
  transition:background .1s;
  color:var(--text2);
}

.nav-item i{font-size:17px;flex-shrink:0;}
.nav-item:hover{background:var(--surface2);color:var(--text);}
.nav-item.active{background:var(--accent-bg);color:var(--accent2);border:1px solid var(--accent-border);}

.nav-count{
  margin-left:auto;
  font-family:'DM Mono',monospace;
  font-size:11px;
  background:var(--surface3);
  color:var(--text3);
  padding:1px 7px;
  border-radius:20px;
}
.nav-item.active .nav-count{background:var(--accent-bg);color:var(--accent2);}

.sidebar-foot{
  padding:14px 18px;
  border-top:1px solid var(--border);
  display:flex;align-items:center;gap:10px;
}

.avatar{
  width:30px;height:30px;border-radius:50%;
  background:var(--accent);
  display:flex;align-items:center;justify-content:center;
  font-size:12px;font-weight:600;color:#fff;
  flex-shrink:0;
}

.avatar-info{flex:1;min-width:0;}
.avatar-name{font-size:13px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.avatar-email{font-size:11px;color:var(--text3);font-family:'DM Mono',monospace;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}

/* ── MAIN ─────────────────────────────────── */
.main{
  flex:1;display:flex;flex-direction:column;min-width:0;
}

.topbar{
  height:60px;flex-shrink:0;
  background:var(--surface);
  border-bottom:1px solid var(--border);
  display:flex;align-items:center;gap:12px;
  padding:0 20px;
}

.search-wrap{
  flex:1;max-width:420px;
  display:flex;align-items:center;gap:8px;
  background:var(--surface2);
  border:1px solid var(--border2);
  border-radius:var(--radius-md);
  padding:8px 12px;
  transition:border-color .15s;
}

.search-wrap:focus-within{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-bg);}
.search-wrap i{font-size:16px;color:var(--text3);}
.search-wrap input{border:none;outline:none;background:transparent;flex:1;font-size:13px;color:var(--text);}
.search-wrap input::placeholder{color:var(--text3);}

.topbar-right{margin-left:auto;display:flex;align-items:center;gap:8px;}

.icon-btn{
  width:36px;height:36px;border:1px solid var(--border2);border-radius:var(--radius-md);
  background:var(--surface2);cursor:pointer;
  display:flex;align-items:center;justify-content:center;
  transition:all .15s;color:var(--text2);
}

.icon-btn i{font-size:17px;}
.icon-btn:hover{background:var(--surface3);color:var(--text);border-color:var(--border2);}

.status-dot{
  display:flex;align-items:center;gap:6px;
  font-size:12px;font-weight:500;color:var(--green);
  font-family:'DM Mono',monospace;
}

.status-dot::before{
  content:'';width:7px;height:7px;border-radius:50%;
  background:var(--green);
  box-shadow:0 0 8px var(--green);
  animation:pulse 2s ease infinite;
}

@keyframes pulse{0%,100%{opacity:1;}50%{opacity:.5;}}

/* inbox content */
.inbox-wrap{flex:1;display:flex;min-height:0;}

.mail-list{
  width:380px;flex-shrink:0;
  border-right:1px solid var(--border);
  display:flex;flex-direction:column;
}

.list-header{
  padding:14px 18px;
  border-bottom:1px solid var(--border);
  display:flex;align-items:center;gap:8px;
}

.list-title{font-size:14px;font-weight:600;}
.list-count{
  margin-left:auto;
  font-family:'DM Mono',monospace;font-size:11px;
  background:var(--surface3);color:var(--text3);
  padding:2px 8px;border-radius:20px;
}

.list-scroll{flex:1;overflow-y:auto;}

.list-scroll::-webkit-scrollbar{width:4px;}
.list-scroll::-webkit-scrollbar-track{background:transparent;}
.list-scroll::-webkit-scrollbar-thumb{background:var(--border2);border-radius:4px;}

.mail-row{
  padding:14px 18px;
  border-bottom:1px solid var(--border);
  cursor:pointer;
  transition:background .12s;
  position:relative;
}

.mail-row:hover{background:var(--surface2);}
.mail-row.selected{background:var(--accent-bg);}
.mail-row.selected::before{
  content:'';position:absolute;left:0;top:0;bottom:0;width:3px;
  background:var(--accent);border-radius:0 2px 2px 0;
}

.row-top{display:flex;align-items:flex-start;gap:10px;margin-bottom:5px;}

.row-avatar{
  width:30px;height:30px;border-radius:8px;
  flex-shrink:0;
  display:flex;align-items:center;justify-content:center;
  font-size:12px;font-weight:600;
  font-family:'DM Mono',monospace;
}

.row-meta{flex:1;min-width:0;}
.row-sender{font-size:13px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.row-time{font-size:11px;color:var(--text3);font-family:'DM Mono',monospace;flex-shrink:0;margin-top:2px;}
.row-subject{font-size:13px;font-weight:500;margin-bottom:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.row-preview{font-size:12px;color:var(--text3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}

.unread-badge{
  width:7px;height:7px;border-radius:50%;background:var(--accent);
  flex-shrink:0;margin-top:5px;
}

/* mail detail */
.mail-detail{
  flex:1;display:flex;flex-direction:column;min-width:0;overflow:hidden;
}

.detail-empty{
  flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:12px;color:var(--text3);
}

.detail-empty i{font-size:48px;opacity:.3;}
.detail-empty p{font-size:14px;}

.detail-header{
  padding:18px 24px;
  border-bottom:1px solid var(--border);
  flex-shrink:0;
}

.detail-subject{font-size:18px;font-weight:600;margin-bottom:10px;letter-spacing:-0.2px;}

.detail-meta{
  display:flex;align-items:center;gap:12px;flex-wrap:wrap;
}

.detail-from{
  display:flex;align-items:center;gap:8px;
}

.detail-avatar{
  width:28px;height:28px;border-radius:7px;
  display:flex;align-items:center;justify-content:center;
  font-size:11px;font-weight:600;
  font-family:'DM Mono',monospace;
}

.detail-from-info{}
.detail-name{font-size:13px;font-weight:500;}
.detail-email{font-size:11px;color:var(--text3);font-family:'DM Mono',monospace;}

.detail-time{
  margin-left:auto;
  font-family:'DM Mono',monospace;font-size:12px;color:var(--text3);
}

.detail-body{flex:1;overflow-y:auto;padding:24px;}
.detail-body::-webkit-scrollbar{width:4px;}
.detail-body::-webkit-scrollbar-thumb{background:var(--border2);border-radius:4px;}

.text-body{
  font-size:14px;line-height:1.8;color:var(--text2);
  white-space:pre-wrap;word-break:break-word;
}

.mail-frame{
  width:100%;min-height:500px;border:none;border-radius:var(--radius-lg);
  background:#fff;
}

/* empty list */
.list-empty{
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  height:100%;gap:10px;color:var(--text3);padding:40px;text-align:center;
}

.list-empty i{font-size:36px;opacity:.3;margin-bottom:4px;}
.list-empty p{font-size:13px;line-height:1.6;}

/* loading */
.skeleton{
  background:var(--surface2);
  border-radius:4px;
  animation:shimmer 1.4s ease infinite;
}

@keyframes shimmer{
  0%,100%{opacity:.4;}
  50%{opacity:.8;}
}

/* toast */
.toast{
  position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(10px);
  background:var(--surface3);
  border:1px solid var(--border2);
  color:var(--text);
  padding:10px 16px;border-radius:var(--radius-lg);
  font-size:13px;font-weight:500;
  opacity:0;pointer-events:none;
  transition:all .2s;z-index:9999;
  display:flex;align-items:center;gap:8px;
  box-shadow:0 8px 24px rgba(0,0,0,.4);
}

.toast.show{opacity:1;transform:translateX(-50%) translateY(0);}
.toast i{font-size:16px;color:var(--green);}

/* colors for avatars */
.c0{background:#4f6ef714;color:#6b83f7;}
.c1{background:#22c55e12;color:#4ade80;}
.c2{background:#f59e0b12;color:#fbbf24;}
.c3{background:#ef444412;color:#f87171;}
.c4{background:#8b5cf612;color:#a78bfa;}
.c5{background:#06b6d412;color:#22d3ee;}
</style>
</head>
<body>

<!-- SIDEBAR -->
<div class="sidebar">
  <div class="sidebar-top">
    <div class="wordmark">
      <div class="wordmark-icon"><i class="ti ti-mail-opened"></i></div>
      <span class="wordmark-name">SSIDMail</span>
      <span class="wordmark-badge">ENTERPRISE</span>
    </div>
    <div class="compose-area">
      <div class="field-label">Mailbox Address</div>
      <div class="input-shell">
        <input id="username" placeholder="username" autocomplete="off" spellcheck="false" onkeydown="if(event.key==='Enter')loadInbox()"/>
        <div class="domain-chip">@ssidmail.my.id</div>
      </div>
      <div class="btn-row">
        <button class="btn btn-accent" onclick="loadInbox()" id="refresh-btn">
          <i class="ti ti-refresh"></i> Refresh
        </button>
        <button class="btn" onclick="copyEmail()">
          <i class="ti ti-copy"></i> Copy
        </button>
      </div>
    </div>
  </div>

  <nav class="sidebar-nav">
    <div class="nav-item active">
      <i class="ti ti-inbox"></i> Inbox
      <span class="nav-count" id="nav-count">0</span>
    </div>
    <div class="nav-item">
      <i class="ti ti-clock"></i> Recent
    </div>
    <div class="nav-item">
      <i class="ti ti-star"></i> Starred
    </div>
    <div class="nav-item">
      <i class="ti ti-trash"></i> Trash
    </div>
  </nav>

  <div class="sidebar-foot">
    <div class="avatar" id="user-avatar">—</div>
    <div class="avatar-info">
      <div class="avatar-name" id="user-display">No mailbox</div>
      <div class="avatar-email" id="user-email-foot">Set a username above</div>
    </div>
  </div>
</div>

<!-- MAIN -->
<div class="main">
  <div class="topbar">
    <div class="search-wrap">
      <i class="ti ti-search"></i>
      <input id="searchInput" placeholder="Search by subject or sender..." onkeyup="filterMail()"/>
    </div>
    <div class="topbar-right">
      <div class="status-dot" id="status-text">Live</div>
      <div class="icon-btn" title="Auto-refresh every 15s">
        <i class="ti ti-refresh"></i>
      </div>
    </div>
  </div>

  <div class="inbox-wrap">
    <!-- MAIL LIST -->
    <div class="mail-list">
      <div class="list-header">
        <i class="ti ti-messages" style="font-size:16px;color:var(--text3);"></i>
        <span class="list-title">All Messages</span>
        <span class="list-count" id="list-count">0 messages</span>
      </div>
      <div class="list-scroll" id="mailList">
        <div class="list-empty">
          <i class="ti ti-mailbox"></i>
          <p>Enter a username and click Refresh to load your inbox.</p>
        </div>
      </div>
    </div>

    <!-- MAIL DETAIL -->
    <div class="mail-detail" id="mailDetail">
      <div class="detail-empty">
        <i class="ti ti-mail-opened"></i>
        <p>Select a message to read</p>
      </div>
    </div>
  </div>
</div>

<div class="toast" id="toast"><i class="ti ti-check"></i><span id="toast-msg">Done</span></div>

<script>
const workerURL = "https://email-handler.saisoku-id2020.workers.dev/inbox?email=";
let mailCache = [];
let selectedIndex = -1;
const colorClasses = ['c0','c1','c2','c3','c4','c5'];

function getColor(str){ let h=0; for(let c of (str||'')) h=(h*31+c.charCodeAt(0))&0xffffffff; return colorClasses[Math.abs(h)%6]; }
function getInitial(str){ return (str||'?')[0].toUpperCase(); }

function toast(msg, icon='ti-check'){
  const el = document.getElementById('toast');
  document.getElementById('toast-msg').textContent = msg;
  el.querySelector('i').className = 'ti ' + icon;
  el.classList.add('show');
  setTimeout(()=>el.classList.remove('show'), 2200);
}

function cleanText(c){ if(!c)return''; return c.replace(/=\r?\n/g,'').replace(/=3D/g,'=').replace(/=([A-F0-9]{2})/gi,(m,h)=>String.fromCharCode(parseInt(h,16))).trim(); }
function isHTML(s){ return /<\/?[a-z][\s\S]*>/i.test(s); }

function getSender(mail){
  let from = mail.from?.split(';')[0]?.trim() || 'Unknown';
  const em = from.match(/<([^>]+)>/);
  return em ? em[1] : from;
}

function getSenderName(mail){
  let from = mail.from?.split(';')[0]?.trim() || 'Unknown';
  const name = from.replace(/<[^>]+>/,'').trim();
  return name || from;
}

function getSubject(mail){
  let s = mail.subject?.split(';')[0]?.trim() || '(No Subject)';
  if(s.toLowerCase().includes('mime-version')) s = 'Email Notification';
  return s;
}

function copyEmail(){
  const user = document.getElementById('username').value.trim();
  if(!user){ toast('Enter a username first','ti-alert-circle'); return; }
  navigator.clipboard.writeText(user+'@ssidmail.my.id');
  toast('Address copied to clipboard');
}

function updateUserDisplay(){
  const user = document.getElementById('username').value.trim();
  if(!user) return;
  document.getElementById('user-display').textContent = user;
  document.getElementById('user-email-foot').textContent = user+'@ssidmail.my.id';
  document.getElementById('user-avatar').textContent = getInitial(user);
}

async function loadInbox(){
  const user = document.getElementById('username').value.trim();
  if(!user){ toast('Enter a username first','ti-alert-circle'); return; }
  updateUserDisplay();

  const listEl = document.getElementById('mailList');
  const btn = document.getElementById('refresh-btn');
  btn.innerHTML = '<i class="ti ti-loader" style="animation:spin .6s linear infinite;display:inline-block;"></i> Loading';

  listEl.innerHTML = `<div style="padding:20px 18px;display:flex;flex-direction:column;gap:14px;">${Array(4).fill(`<div style="display:flex;gap:10px;align-items:flex-start;"><div class="skeleton" style="width:30px;height:30px;border-radius:8px;flex-shrink:0;"></div><div style="flex:1;display:flex;flex-direction:column;gap:6px;"><div class="skeleton" style="height:11px;width:60%;border-radius:4px;"></div><div class="skeleton" style="height:11px;width:85%;border-radius:4px;"></div><div class="skeleton" style="height:11px;width:40%;border-radius:4px;"></div></div></div>`).join('')}</div>`;

  try{
    const res = await fetch(workerURL + encodeURIComponent(user+'@ssidmail.my.id') + '&t=' + Date.now());
    const data = await res.json();
    btn.innerHTML = '<i class="ti ti-refresh"></i> Refresh';

    if(!data||data.length===0){
      document.getElementById('nav-count').textContent = '0';
      document.getElementById('list-count').textContent = '0 messages';
      listEl.innerHTML = `<div class="list-empty"><i class="ti ti-inbox-off"></i><p>No emails yet. Send something to ${user}@ssidmail.my.id</p></div>`;
      return;
    }

    mailCache = data.sort((a,b)=>{
      const tA=parseInt(a.id.split(':').pop())||0, tB=parseInt(b.id.split(':').pop())||0;
      return tB-tA;
    });

    renderList(mailCache);
    toast('Inbox updated — ' + mailCache.length + ' message' + (mailCache.length!==1?'s':''));
  }catch(e){
    btn.innerHTML = '<i class="ti ti-refresh"></i> Refresh';
    listEl.innerHTML = `<div class="list-empty"><i class="ti ti-wifi-off"></i><p>Failed to connect. Check your connection and try again.</p></div>`;
    toast('Failed to load inbox','ti-x');
  }
}

function renderList(mails){
  document.getElementById('nav-count').textContent = mails.length;
  document.getElementById('list-count').textContent = mails.length + ' message' + (mails.length!==1?'s':'');

  const listEl = document.getElementById('mailList');
  if(!mails.length){
    listEl.innerHTML = `<div class="list-empty"><i class="ti ti-search-off"></i><p>No messages match your search.</p></div>`;
    return;
  }

  listEl.innerHTML = mails.map((mail,i)=>{
    const sender = getSender(mail);
    const sname = getSenderName(mail);
    const subj = getSubject(mail);
    const cc = getColor(sender);
    const init = getInitial(sname || sender);
    const preview = cleanText((mail.content||'').replace(/<[^>]*>/gm,'')).slice(0,90);
    const date = mail.receivedAt || mail.date || '';
    const realIdx = mailCache.indexOf(mail);
    return `
    <div class="mail-row${realIdx===selectedIndex?' selected':''}" onclick="openMail(${realIdx})">
      <div class="row-top">
        <div class="row-avatar ${cc}">${init}</div>
        <div class="row-meta">
          <div class="row-sender">${sname||sender}</div>
        </div>
        <div class="row-time">${date.split(' ')[0]||''}</div>
      </div>
      <div class="row-subject">${subj}</div>
      <div class="row-preview">${preview||'No preview available'}</div>
    </div>`;
  }).join('');
}

function openMail(index){
  selectedIndex = index;
  const mail = mailCache[index];
  const sender = getSender(mail);
  const sname = getSenderName(mail);
  const subj = getSubject(mail);
  const cc = getColor(sender);
  const init = getInitial(sname||sender);
  const date = mail.receivedAt || mail.date || '';

  // re-render list to update selection
  const q = document.getElementById('searchInput').value.toLowerCase();
  const filtered = q ? mailCache.filter(m=>(m.subject||'').toLowerCase().includes(q)||(m.from||'').toLowerCase().includes(q)) : mailCache;
  renderList(filtered);

  let bodyHTML = '';
  const content = mail.content || '';
  if(isHTML(content)){
    const blob = new Blob([`<html><body style="font-family:Arial,sans-serif;font-size:14px;padding:20px;background:#fff;color:#111;line-height:1.7;">${content}</body></html>`],{type:'text/html'});
    bodyHTML = `<iframe class="mail-frame" src="${URL.createObjectURL(blob)}" sandbox="allow-popups allow-same-origin"></iframe>`;
  } else {
    bodyHTML = `<div class="text-body">${cleanText(content)||'(Empty message)'}</div>`;
  }

  document.getElementById('mailDetail').innerHTML = `
    <div class="detail-header">
      <div class="detail-subject">${subj}</div>
      <div class="detail-meta">
        <div class="detail-from">
          <div class="detail-avatar ${cc}">${init}</div>
          <div class="detail-from-info">
            <div class="detail-name">${sname||sender}</div>
            <div class="detail-email">${sender}</div>
          </div>
        </div>
        <div class="detail-time">${date}</div>
      </div>
    </div>
    <div class="detail-body">${bodyHTML}</div>`;
}

function filterMail(){
  const q = document.getElementById('searchInput').value.toLowerCase();
  const filtered = q ? mailCache.filter(m=>(m.subject||'').toLowerCase().includes(q)||(m.from||'').toLowerCase().includes(q)) : mailCache;
  renderList(filtered);
}

// auto refresh
setInterval(()=>{ const u=document.getElementById('username').value.trim(); if(u) loadInbox(); }, 15000);
</script>
</body>
