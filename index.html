<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>SSIDMail // Email Acces</title>

<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;600;700&family=Poppins:wght@400;500;600&display=swap" rel="stylesheet">

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{

    font-family:'Poppins',sans-serif;

    background:#02030a;

    min-height:100vh;

    overflow-x:hidden;

    color:#dbe7ff;
}

/* =========================
   FULL HUD IMAGE BG
========================= */

.hud-bg{

    position:fixed;

    inset:0;

    width:100%;

    height:100%;

    z-index:0;

    pointer-events:none;

    background-image:url("hud backgroud ssidmail.png");

    background-size:cover;

    background-position:center;

    background-repeat:no-repeat;

    opacity:1;
}

/* =========================
   OVERLAY
========================= */

.bg-overlay{

    position:fixed;

    inset:0;

    z-index:1;

    pointer-events:none;

    background:

    radial-gradient(
        circle at center,
        rgba(0,0,0,0.05),
        rgba(0,0,0,0.55)
    );
}

/* =========================
   SCANLINES
========================= */

.scanlines{

    position:fixed;

    inset:0;

    z-index:2;

    pointer-events:none;

    background:
    repeating-linear-gradient(
        to bottom,
        rgba(255,255,255,0.012),
        rgba(255,255,255,0.012) 1px,
        transparent 1px,
        transparent 4px
    );
}

/* =========================
   CONTENT LAYER
========================= */

.wrapper,
.login-box{

    position:relative;

    z-index:5;
}

/* =========================
   LOGIN
========================= */

.login-box{

    width:100%;

    max-width:420px;

    margin:90px auto;
}

/* =========================
   MAIN WRAPPER
========================= */

.wrapper{

    width:100%;

    max-width:980px;

    margin:40px auto;
}

/* =========================
   CYBER CARD
========================= */

.card{

    position:relative;

    background:rgba(3,8,20,0.62);

    backdrop-filter:blur(18px);

    border:1px solid rgba(255,60,60,0.14);

    border-radius:22px;

    padding:26px;

    margin-bottom:24px;

    overflow:hidden;

    box-shadow:

        0 0 0 1px rgba(255,80,80,0.04),

        0 0 40px rgba(255,0,60,0.08),

        0 0 120px rgba(0,40,255,0.05);
}

.card::before{

    content:"";

    position:absolute;

    inset:0;

    background:
    linear-gradient(
        135deg,
        rgba(255,0,60,0.04),
        transparent 35%,
        rgba(0,120,255,0.04)
    );

    pointer-events:none;
}

.card::after{

    content:"";

    position:absolute;

    top:0;
    left:0;

    width:100%;
    height:1px;

    background:
    linear-gradient(
        90deg,
        transparent,
        #ff003c,
        #ff6b00,
        transparent
    );
}

/* =========================
   TITLES
========================= */

h2,h3{

    font-family:'Orbitron',sans-serif;

    letter-spacing:2px;

    margin-bottom:18px;

    color:#ffffff;

    text-shadow:
        0 0 10px rgba(255,80,80,0.5);
}

/* =========================
   INPUTS
========================= */

.username-group{

    display:flex;

    gap:10px;

    margin-bottom:15px;
}

.username-group input,
.login-input{

    width:100%;

    padding:14px;

    border-radius:12px;

    border:1px solid rgba(255,255,255,0.08);

    background:rgba(0,0,0,0.35);

    color:#ffffff;

    outline:none;

    transition:0.3s;
}

.username-group input:focus,
.login-input:focus{

    border-color:#ff3355;

    box-shadow:
        0 0 15px rgba(255,0,60,0.25);
}

.domain-label{

    display:flex;

    align-items:center;

    padding:0 16px;

    border-radius:12px;

    background:rgba(255,255,255,0.04);

    color:#8eb8ff;

    font-size:14px;
}

/* =========================
   BUTTONS
========================= */

.buttons{

    display:grid;

    grid-template-columns:repeat(3,1fr);

    gap:12px;
}

button{

    border:none;

    padding:13px;

    border-radius:12px;

    cursor:pointer;

    font-weight:600;

    color:white;

    transition:0.25s;

    position:relative;

    overflow:hidden;
}

button:hover{

    transform:translateY(-2px);
}

.generate{

    background:#2048ff;

    box-shadow:
        0 0 20px rgba(32,72,255,0.35);
}

.copy{

    background:#00ffd0;

    color:#001018;

    box-shadow:
        0 0 20px rgba(0,255,208,0.3);
}

.refresh{

    background:#ff5b2e;

    box-shadow:
        0 0 20px rgba(255,91,46,0.35);
}

.login-btn{

    width:100%;

    background:#ff003c;

    margin-top:5px;

    box-shadow:
        0 0 25px rgba(255,0,60,0.35);
}

.logout-btn{

    width:100%;

    margin-top:12px;

    background:#ff003c;
}

/* =========================
   DARK BUTTON
========================= */

.dark-btn{

    position:absolute;

    top:20px;
    right:20px;

    background:#111827;
}

/* =========================
   MAILS
========================= */

.mail{

    background:rgba(255,255,255,0.025);

    border:1px solid rgba(255,255,255,0.06);

    border-radius:16px;

    padding:20px;

    margin-bottom:16px;

    transition:0.25s;

    cursor:pointer;
}

.mail:hover{

    border-color:rgba(255,0,60,0.25);

    transform:translateY(-2px);

    box-shadow:
        0 0 30px rgba(255,0,60,0.08);
}

.subject{

    color:#ff4f6d;

    font-weight:600;

    margin-bottom:6px;
}

.meta{

    font-size:12px;

    color:#8aa0c7;

    line-height:1.7;
}

/* =========================
   MAIL VIEW
========================= */

.mail-frame{

    width:100%;

    min-height:700px;

    border:none;

    border-radius:12px;

    background:#ffffff;
}

.mail-body{

    line-height:1.7;

    font-size:14px;
}

/* =========================
   MOBILE
========================= */

@media(max-width:768px){

    body{
        padding:20px;
    }

    .buttons{
        grid-template-columns:1fr;
    }

    .username-group{
        flex-direction:column;
    }

    .domain-label{
        justify-content:center;
        padding:14px;
    }

    .wrapper{
        margin-top:20px;
    }
}

</style>
</head>

<body>

<!-- FULL HUD IMAGE -->

<div class="hud-bg"></div>

<!-- OVERLAY -->

<div class="bg-overlay"></div>

<!-- SCANLINES -->

<div class="scanlines"></div>

<!-- LOGIN PAGE -->

<div id="loginPage" class="login-box">

<div class="card">

<h2>SSIDMail ACCESS</h2>

<input
id="loginUser"
class="login-input"
placeholder="Username">

<br><br>

<input
id="loginPass"
type="password"
class="login-input"
placeholder="Password">

<button
class="login-btn"
onclick="login()">

LOGIN

</button>

</div>
</div>

<!-- MAIN APP -->

<div id="mainApp" style="display:none;">

<div class="wrapper">

<div class="card">

<button class="dark-btn" onclick="toggleDark()">
🌙 DARK
</button>

<h2>SSIDMail TACTICAL HUD</h2>

<div class="username-group">

<input
id="username"
placeholder="Enter username">

<div class="domain-label">
@ssidmail.my.id
</div>

</div>

<div class="buttons">

<button
class="generate"
onclick="createEmail()">

CREATE

</button>

<button
class="copy"
onclick="copyEmail()">

COPY

</button>

<button
class="refresh"
onclick="loadInbox()">

REFRESH

</button>

</div>

<button
class="logout-btn"
onclick="logout()">

LOGOUT

</button>

</div>

<div class="card">

<h3>INBOX</h3>

<div id="inboxContent">

No emails loaded...

</div>

</div>

</div>
</div>

<script>

const workerURL =
"https://email-handler.saisoku-id2020.workers.dev/inbox?email=";

/* LOGIN */

const APP_USER = "admin";
const APP_PASS = "12345";

function login(){

const user =
document.getElementById("loginUser").value.trim();

const pass =
document.getElementById("loginPass").value.trim();

if(user === APP_USER && pass === APP_PASS){

localStorage.setItem("ssidmail_login","true");

document.getElementById("loginPage").style.display = "none";

document.getElementById("mainApp").style.display = "block";

}else{

alert("ACCESS DENIED");
}
}

function logout(){

localStorage.removeItem("ssidmail_login");

location.reload();
}

function checkLogin(){

const logged =
localStorage.getItem("ssidmail_login");

if(logged === "true"){

document.getElementById("loginPage").style.display = "none";

document.getElementById("mainApp").style.display = "block";

}else{

document.getElementById("loginPage").style.display = "block";

document.getElementById("mainApp").style.display = "none";
}
}

checkLogin();

/* MAIL SYSTEM */

function cleanText(content){

if(!content) return "";

return content
.replace(/=\r?\n/g,"")
.replace(/=3D/g,"=")
.replace(/=([A-F0-9]{2})/gi,
(m,hex)=>String.fromCharCode(parseInt(hex,16)))
.trim();
}

function isHTML(str){

return /<\/?[a-z][\s\S]*>/i.test(str);
}

function createEmail(){

const user =
document.getElementById("username").value.trim();

if(!user) return;

loadInbox();
}

function copyEmail(){

const user =
document.getElementById("username").value.trim();

if(!user) return;

navigator.clipboard.writeText(
user + "@ssidmail.my.id"
);
}

let mailCache = [];

async function loadInbox(){

const user =
document.getElementById("username").value.trim();

if(!user) return;

const inbox =
document.getElementById("inboxContent");

inbox.innerHTML = "Loading...";

try {

const res = await fetch(
workerURL +
user +
"@ssidmail.my.id" +
"&t=" +
Date.now()
);

if (!res.ok)
throw new Error("Network response was not ok");

const data = await res.json();

if(!data || data.length === 0){

inbox.innerHTML = "No emails yet...";
return;
}

mailCache = data.sort((a, b) => {

const tsA =
parseInt(a.id.split(':').pop()) || 0;

const tsB =
parseInt(b.id.split(':').pop()) || 0;

return tsB - tsA;
});

let html = "";

mailCache.forEach((mail, i) => {

const displayDate =
mail.receivedAt ||
mail.date ||
"Unknown Date";

let cleanSubject =
mail.subject
? mail.subject.split(';')[0].trim()
: "Notification";

let cleanFrom =
mail.from
? mail.from.split(';')[0].trim()
: "Unknown Sender";

const emailMatch =
cleanFrom.match(/<([^>]+)>/);

if(emailMatch)
cleanFrom = emailMatch[1];

html += `

<div class="mail"
onclick="openMail(${i})">

<div class="subject">
${cleanSubject}
</div>

<div class="meta">

<b>From:</b> ${cleanFrom}
<br>

<b>Received:</b> ${displayDate}

</div>

<div
id="mail-body-${i}"
style="
display:none;
margin-top:15px;
border-top:1px solid rgba(255,255,255,0.08);
padding-top:15px;
">

</div>

</div>
`;
});

inbox.innerHTML = html;

} catch(e) {

console.error("Fetch Error:", e);

inbox.innerHTML =
"<span style='color:red;'>Failed to load inbox.</span>";
}
}

function openMail(index){

const container =
document.getElementById("mail-body-"+index);

if(container.style.display === "block"){

container.style.display = "none";
return;
}

const mail = mailCache[index];

let content = mail.content || "";

if(isHTML(content)){

const safeHTML = `
<!DOCTYPE html>
<html>
<head>

<base target="_blank">

<style>

body{
margin:0;
padding:15px;
font-family:Arial,sans-serif;
background:#fff;
}

img{
max-width:100%;
height:auto;
}

a{
word-break:break-all;
}

</style>

</head>

<body>

${content}

</body>
</html>
`;

container.innerHTML = `

<iframe
class="mail-frame"
sandbox="allow-popups allow-popups-to-escape-sandbox"
srcdoc='${safeHTML
.replace(/'/g,"&apos;")
.replace(/"/g,"&quot;")}'>
</iframe>

`;

}else{

container.innerHTML = `
<div class="mail-body">
${cleanText(content)}
</div>
`;
}

container.style.display = "block";
}

function toggleDark(){

document.body.classList.toggle("dark");
}

</script>

</body>
</html>
